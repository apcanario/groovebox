<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;background:#0a0a0c;color:#f2f2f4;font-family:'DM Sans',sans-serif;overflow:hidden}
.mono{font-family:'Space Mono',monospace}
.wrap{display:flex;flex-direction:column;height:844px;padding:14px 14px 0}
/* transport */
.top{display:flex;align-items:center;gap:10px;height:48px}
.play{width:48px;height:48px;border-radius:12px;background:#ff6b6b;display:flex;align-items:center;justify-content:center}
.play i{display:block;width:0;height:0;border-left:16px solid #0a0a0c;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.pill{height:48px;border-radius:12px;background:#131316;padding:0 14px;display:flex;flex-direction:column;justify-content:center}
.pill b{font-family:'Space Mono',monospace;font-size:17px;line-height:1.1}
.pill span{font-size:10px;letter-spacing:.12em;color:#8d8d99;text-transform:uppercase}
.grow{flex:1}
.rec{width:48px;height:48px;border-radius:12px;background:#131316;display:flex;align-items:center;justify-content:center}
.rec i{width:16px;height:16px;border-radius:50%;border:2.5px solid #ff6b6b}
/* sections */
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sec{height:46px;border-radius:10px;background:#131316;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.sec b{font-family:'Space Mono',monospace;font-size:15px}
.sec span{font-size:10px;color:#8d8d99;letter-spacing:.08em;text-transform:uppercase}
.sec.playing{background:#2a9d8f;color:#0a0a0c}
.sec.playing span{color:#0a0a0c;opacity:.75}
.sec.edit{outline:2px solid #e9c46a;outline-offset:-2px}
.sec.edit span{color:#e9c46a}
/* header */
.head{display:flex;align-items:center;margin-top:16px}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.head h1 em{font-style:normal;color:#9b5de5}
.tog{margin-left:auto;width:54px;height:30px;border-radius:15px;background:#9b5de5;position:relative}
.tog i{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#0a0a0c}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mode{height:36px;border-radius:10px;background:#131316;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#8d8d99}
.mode.on{background:#9b5de5;color:#0a0a0c}
/* steps */
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:12px}
.st{height:22px;border-radius:4px;background:#131316}
.st.h{background:#9b5de5}
.st.h.lo{background:#9b5de5;opacity:.45}
.st.now{outline:2px solid #f2f2f4;outline-offset:-2px}
/* dials */
.dials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.dial{background:#131316;border-radius:14px;height:122px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.dial svg{width:78px;height:78px}
.dial .val{position:absolute;top:35px;left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-size:16px;font-weight:700}
.dial label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
/* xy */
.xy{margin-top:8px;background:#131316;border-radius:14px;height:200px;position:relative;overflow:hidden}
.xy .gx,.xy .gy{position:absolute;background:#1f1f25}
.xy .gx{left:0;right:0;height:1px}
.xy .gy{top:0;bottom:0;width:1px}
.xy .hx{position:absolute;left:0;right:0;top:72px;height:2px;background:#f4a261;opacity:.5}
.xy .hy{position:absolute;top:0;bottom:0;left:236px;width:2px;background:#f4a261;opacity:.5}
.xy .dot{position:absolute;left:215px;top:51px;width:44px;height:44px;border-radius:50%;background:#f4a261}
.xy .lx{position:absolute;left:12px;bottom:9px;font-size:11px;font-weight:600;letter-spacing:.12em;color:#f4a261}
.xy .ly{position:absolute;left:12px;top:10px;font-size:11px;font-weight:600;letter-spacing:.12em;color:#f4a261}
.xy .rv{position:absolute;right:12px;bottom:8px;font-family:'Space Mono',monospace;font-size:12px;color:#8d8d99}
/* sends */
.sends{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.send{background:#131316;border-radius:12px;height:44px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:600;letter-spacing:.12em}
.send .fill{position:absolute;left:0;top:0;bottom:0}
.send span{position:relative}
.send b{position:relative;margin-left:auto;font-family:'Space Mono',monospace;font-size:13px}
/* tabs */
.tabs{margin:auto -14px 0;height:66px;background:#131316;display:grid;grid-template-columns:repeat(8,1fr);align-items:center;padding:0 4px 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.06em;color:#8d8d99;text-transform:uppercase}
.tab svg{width:24px;height:24px;stroke:#8d8d99;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#9b5de5}
.tab.on svg{stroke:#9b5de5}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="play"><i></i></div>
    <div class="pill"><b>124</b><span>bpm</span></div>
    <div class="pill"><b>A min</b><span>deep</span></div>
    <div class="grow"></div>
    <div class="pill"><b>17.3</b><span>bar</span></div>
    <div class="rec"><i></i></div>
  </div>

  <div class="secs">
    <div class="sec"><b>A</b><span>Intro</span></div>
    <div class="sec playing"><b>B</b><span>Playing</span></div>
    <div class="sec edit"><b>C</b><span>Editing</span></div>
    <div class="sec"><b>D</b><span>Outro</span></div>
  </div>

  <div class="head"><h1><em>Layer 1</em> · Lead</h1><div class="tog"><i></i></div></div>
  <div class="modes">
    <div class="mode">Arp</div><div class="mode on">Generative</div><div class="mode">Pad</div>
  </div>

  <div class="steps" id="steps"></div>
  <div class="dials" id="dials"></div>

  <div class="xy">
    <div class="gx" style="top:67px"></div><div class="gx" style="top:133px"></div>
    <div class="gy" style="left:90px"></div><div class="gy" style="left:181px"></div><div class="gy" style="left:271px"></div>
    <div class="hx"></div><div class="hy"></div><div class="dot"></div>
    <div class="ly">RESONANCE ↑</div><div class="lx">CUTOFF →</div>
    <div class="rv">1.8 kHz · 62%</div>
  </div>

  <div class="sends">
    <div class="send"><div class="fill" style="width:45%;background:#457b9d"></div><span>DELAY</span><b>45</b></div>
    <div class="send"><div class="fill" style="width:70%;background:#2a9d8f"></div><span>REVERB</span><b>70</b></div>
  </div>

  <div class="tabs">
    <div class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Play</div>
    <div class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v10M15 4v10M9 14v6M15 14v6"/></svg>Chords</div>
    <div class="tab"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="8" rx="8" ry="3.5"/><path d="M4 8v8c0 2 3.6 3.5 8 3.5s8-1.500 8-3.5V8"/></svg>Drums</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M3 15c3 0 3-8 6-8s3 10 6 10 3-6 6-6"/></svg>Bass</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M3 17l5-10v10l5-10v10l5-10v10h3"/></svg>Synth</div>
    <div class="tab on"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>Layer 1</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg>Layer 2</div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M6 3v18M12 3v18M18 3v18"/><rect x="4" y="13" width="4" height="4" rx="1" fill="#131316"/><rect x="10" y="6" width="4" height="4" rx="1" fill="#131316"/><rect x="16" y="11" width="4" height="4" rx="1" fill="#131316"/></svg>Mix</div>
  </div>
</div>
<script>
// steps: Euclidean 7 hits in 16, rotated
const hits=[0,2,5,7,9,11,14], soft=[5,11];
const s=document.getElementById('steps');
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='st'+(hits.includes(i)?' h':'')+(soft.includes(i)?' lo':'')+(i===9?' now':'');s.appendChild(d);}
// dials
const D=[['Lock',0.82,'82','#ff6b6b'],['Hits',7/16,'7','#9b5de5'],['Length',7/16,'7','#e9c46a'],['Tension',0.35,'35','#f4a261'],['Density',0.6,'60','#2a9d8f'],['Rotate',2/16,'2','#457b9d']];
const pt=(a,r)=>[39+r*Math.cos(a*Math.PI/180),39+r*Math.sin(a*Math.PI/180)];
const arc=(a0,a1,r)=>{const[x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);return`M${x0} ${y0}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`};
const el=document.getElementById('dials');
D.forEach(([n,v,t,c])=>{
  const end=135+270*v;
  el.insertAdjacentHTML('beforeend',`<div class="dial"><svg viewBox="0 0 78 78"><path d="${arc(135,405,32)}" stroke="#26262d" stroke-width="9" fill="none" stroke-linecap="round"/><path d="${arc(135,end,32)}" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/></svg><div class="val">${t}</div><label style="color:${c}">${n}</label></div>`);
});
</script>
</body></html>
