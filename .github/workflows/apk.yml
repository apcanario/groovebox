name: Build debug APK

# G6: on every push to main, build the debug APK and put it on the release named `latest` (docs/INSTALL.md).
# Separate from pages.yml: its own concurrency group, nothing shared, so the Pages deploy is untouched.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Not cancelled in progress (G6 review M1): a cancel between `gh release delete` and `create` would leave no release.
# A newer push waits; GitHub drops any older run still waiting. The APK's versionCode is GITHUB_RUN_NUMBER
# (android/app/build.gradle) and it is signed with the committed debug key android/app/debug.keystore (E2).
concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 compiles its Android library for Java 21 (JavaVersion.VERSION_21), so 17 cannot build it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME=/usr/local/lib/android/sdk). No setup-android:
      # its v3 asks sdkmanager for the removed package `tools` and fails (run 46046532163). `yes` stops on SIGPIPE once
      # the prompts end, so only the licence pipe carries `|| true`. Then install what android/ needs: compileSdk 36
      # (android/variables.gradle) and build-tools 35.0.0 (the default of AGP 8.13, android/build.gradle; no
      # buildToolsVersion is set). Already-installed packages are a no-op.
      - name: Android SDK licences and packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - run: npm ci
      - run: npm run build:android
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: testDebugUnitTest
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk groovebox-debug.apk
      # The release `latest` is recreated on each push, so its tag points at the commit the APK was built from.
      - name: Publish release latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest groovebox-debug.apk \
            --title latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Debug APK built from ${GITHUB_SHA}. Install: docs/INSTALL.md."
